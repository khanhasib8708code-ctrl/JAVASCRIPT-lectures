<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

</head>

<body class="bg-slate-100 min-h-screen py-10 px-4">

    <div class="max-w-md mx-auto bg-white rounded-2xl shadow-lg   overflow-hidden border border-slate-200">
        <div class="bg-indigo-600 px-6 py-5 text-white">
            <h1 class="text-2xl font-bold tracking-wide">Todo App</h1>
        </div>
        <div class="p-5">
            <form id="todo-form" action="" class="flex flex-col mb-6">
                <div class="flex gap-5 mb-1">
                    <input id="todo-input" type="text" placeholder="Enter task description..." class="flex-1 px-4 py-2  border border-slate-300 rounded-lg text-slate-800
                        focus:outline-none focus:ring-2 focus:ring-indigo-700">
                    <button id="form-btn"
                        class="px-5 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-lg transition-colors cursor-pointer">Add</button>

                    <button type="button" id="cancel-btn"
                        class="hidden self-end text-xs text-slate-500 hover:text-slate-700 underline cursor-pointer">
                        Cancel Editing
                    </button>
                </div>
            </form>


            <div
                class="flex items-center justify-between py-2 border-b border-slate-100 mb-4 text-xs font-semibold text-slate-500 uppercase tracking-wider">
                <p id="task-count">TASKS (0)</p>
                <p id="complete-count">COMPLETED : 0</p>
            </div>
            <ul class="flex flex-col gap-3" id="todo-list">

                <!-- Todo Template -->

                <!-- <li class="border border-slate-200 p-4 flex gap-2 rounded-xl" >
                    <input type="checkbox">
                    <p class="flex-1">Go to gym</p>
                   <div class="flex gap-2">
                     <button>Edit</button>
                    <button>Delete</button>
                   </div>

                </li> -->
            </ul>
        </div>
    </div>

    <script src="index.js"></script>
</body>

</html>
